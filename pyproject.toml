[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd_bench"
version = "0.2.3"
description = "CFD-Bench: scientific data processing benchmark for PostgreSQL, IoTDB, TileDB, and VTK"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
iotdb = ["apache-iotdb"]
postgresql = ["psycopg2-binary", "scipy", "tqdm"]
tiledb = ["tiledb"]
vtk = ["vtk"]
h5 = ["h5py"]
all = ["apache-iotdb", "psycopg2-binary", "scipy", "tqdm", "tiledb", "vtk", "h5py"]

[project.scripts]
cfd-bench = "cfd_bench.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
